  viewBox="-19.00 -750.00 10392.00 792.00"
  role="img"
  aria-label="Archimmersion">
  <style>
    .letter {
      animation: settle-letter 1.46s cubic-bezier(0.2, 0.72, 0.2, 1) both;
      animation-delay: var(--letter-delay);
      transform: translateX(var(--construct-x));
      transform-box: fill-box;
      transform-origin: center;
    }

    .construction-line {
      animation: draw-contour 1.18s cubic-bezier(0.4, 0, 0.2, 1) both;
      animation-delay: calc(var(--letter-delay) + var(--contour-delay));
      fill: none;
      stroke: #161616;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-opacity: 0;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .letter-fill {
      animation: fill-letter 460ms ease-out both;
      animation-delay: calc(var(--letter-delay) + 1.02s);
      fill: #161616;
      fill-opacity: 0;
      stroke: none;
    }

    @keyframes settle-letter {
      0%,
      18% {
        transform: translateX(var(--construct-x));
      }

      82%,
      100% {
        transform: translateX(0);
      }
    }

    @keyframes draw-contour {
      0% {
        stroke-dashoffset: 1;
        stroke-opacity: 0;
      }

      8% {
        stroke-opacity: 0.72;
      }

      82% {
        stroke-dashoffset: 0;
        stroke-opacity: 0.72;
      }

      100% {
        stroke-dashoffset: 0;
        stroke-opacity: 0;
      }
    }

    @keyframes fill-letter {
      0% {
        fill-opacity: 0;
      }

      100% {
        fill-opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter,
      .construction-line,
      .letter-fill {
        animation: none;
      }

      .letter {
        transform: none;
      }

      .construction-line {
        stroke-opacity: 0;
      }

      .letter-fill {
        fill-opacity: 1;
      }
    }
  </style>
